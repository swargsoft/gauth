name: Build and release all platforms

on:
  push:
    tags:
      - "v*.*.*"

env:
  MODULE: github.com/swargsoft/gauth

permissions:
  contents: write

# One job per platform - run in parallel.
# Per-artifact .sha256 generated by each build job; aggregated
# SHA256SUMS + latest.json manifest generated by the checksums job
# (mirrors wa-engine's build-release.yml so the proxy + msgly can
# fetch gauth securely through the same delivery path).
jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install gcc
        run: sudo apt-get install -y gcc
      - name: Build
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o gauth-linux-amd64 ./cmd/server
      - name: Generate checksum
        id: checksum
        run: |
          SHA=$(sha256sum gauth-linux-amd64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  gauth-linux-amd64" > gauth-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          retention-days: 1
          path: |
            gauth-linux-amd64
            gauth-linux-amd64.sha256

  build-linux-arm64:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install arm64 cross-compiler
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o gauth-linux-arm64 ./cmd/server
      - name: Generate checksum
        id: checksum
        run: |
          SHA=$(sha256sum gauth-linux-arm64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  gauth-linux-arm64" > gauth-linux-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          retention-days: 1
          path: |
            gauth-linux-arm64
            gauth-linux-arm64.sha256

  # Single job builds BOTH mac binaries on the ARM runner via cross-compilation.
  build-mac:
    runs-on: macos-14
    timeout-minutes: 20
    outputs:
      sha256_arm64: ${{ steps.checksum-arm64.outputs.sha256 }}
      sha256_amd64: ${{ steps.checksum-amd64.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build mac-arm64
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o gauth-mac-arm64 ./cmd/server
      - name: Checksum mac-arm64
        id: checksum-arm64
        run: |
          SHA=$(shasum -a 256 gauth-mac-arm64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  gauth-mac-arm64" > gauth-mac-arm64.sha256
      - name: Build mac-amd64 (cross-compiled from ARM)
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o gauth-mac-amd64 ./cmd/server
      - name: Checksum mac-amd64
        id: checksum-amd64
        run: |
          SHA=$(shasum -a 256 gauth-mac-amd64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  gauth-mac-amd64" > gauth-mac-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          retention-days: 1
          path: |
            gauth-mac-arm64
            gauth-mac-arm64.sha256
            gauth-mac-amd64
            gauth-mac-amd64.sha256

  build-windows-amd64:
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o gauth-windows-amd64.exe ./cmd/server
      - name: Generate checksum
        id: checksum
        shell: bash
        run: |
          SHA=$(sha256sum gauth-windows-amd64.exe | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  gauth-windows-amd64.exe" > gauth-windows-amd64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          retention-days: 1
          path: |
            gauth-windows-amd64.exe
            gauth-windows-amd64.exe.sha256

  # ── Generate aggregated checksums + version manifest ─────────────────────────
  checksums:
    needs: [build-linux-amd64, build-linux-arm64, build-mac, build-windows-amd64]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate aggregated SHA256SUMS
        run: |
          find dist -name '*.sha256' -exec cat {} + | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Generate version manifest (latest.json)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_url": "https://github.com/${{ github.repository }}/releases/tag/${VERSION}",
            "platforms": {
              "mac-arm64": {
                "filename": "gauth-mac-arm64",
                "url": "${TAG_URL}/gauth-mac-arm64",
                "sha256": "${{ needs.build-mac.outputs.sha256_arm64 }}"
              },
              "mac-amd64": {
                "filename": "gauth-mac-amd64",
                "url": "${TAG_URL}/gauth-mac-amd64",
                "sha256": "${{ needs.build-mac.outputs.sha256_amd64 }}"
              },
              "linux-amd64": {
                "filename": "gauth-linux-amd64",
                "url": "${TAG_URL}/gauth-linux-amd64",
                "sha256": "${{ needs.build-linux-amd64.outputs.sha256 }}"
              },
              "linux-arm64": {
                "filename": "gauth-linux-arm64",
                "url": "${TAG_URL}/gauth-linux-arm64",
                "sha256": "${{ needs.build-linux-arm64.outputs.sha256 }}"
              },
              "windows-amd64": {
                "filename": "gauth-windows-amd64.exe",
                "url": "${TAG_URL}/gauth-windows-amd64.exe",
                "sha256": "${{ needs.build-windows-amd64.outputs.sha256 }}"
              }
            }
          }
          EOF

      - name: Upload aggregated checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          retention-days: 1
          path: |
            SHA256SUMS
            latest.json

  release:
    needs: [build-linux-amd64, build-linux-arm64, build-mac, build-windows-amd64, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          chmod +x release/gauth-linux-* release/gauth-mac-* 2>/dev/null || true
          ls -la release
      - name: Copy installer scripts
        run: cp installers/install.sh installers/install.ps1 release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # ── Delete this run's intermediate artifacts after release ─────────────────
  cleanup:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete this run's artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            let deleted = 0;
            for await (const page of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            )) {
              for (const a of page.data) {
                if (a.expired) continue;
                if (a.workflow_run?.id !== runId) continue;
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                core.info(`deleted artifact ${a.name} (${a.id})`);
                deleted++;
              }
            }
            core.info(`Deleted ${deleted} artifact(s) for run ${runId}`);